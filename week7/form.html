<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>

    <h1>Registration Form</h1>

    <form>

        <div class="box">

            <div class="name">

                <div>
                    <input type="text" id="fname" name="fname" placeholder="Frist name">
                </div>

                <div>
                    <input type="text" id="lname" name="lname" placeholder="Last name">
                </div>

            </div>

            <br><br>

            <div class="infor">

                <div>
                    <input type="date">
                </div>

                <div>
                    <input type="email" id="email" name="e_mail" placeholder="Email Address" required>
                </div>

            </div>

            <br><br>

            <div>
                <input type="url" placeholder="Homepage Url">
            </div>

            <br><br>

            <div>
                <p>Choose Your Favourite Colors:</p>
                <input type="radio" id="blue" name="fav_colors" value="Blue">
                <label for="blue">Blue</label><br>
                <input type="radio" id="yellow" name="fav_colors" value="Yellow">
                <label for="yellow">Yellow</label><br>
                <input type="radio" id="red" name="fav_colors" value="Red">
                <label for="red">Red</label>
            </div>

            <br><br>

            <div>
                <input type="text" id="bio" name="Bio" placeholder="Bio/Self Introduction">
            </div>

            <br><br>

            <div>
                <input type="submit" value="Submit">
            </div>

        </div>
    </form>

</body>

</html>
