<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative-travel</title>
    <link rel="stylesheet" href="css/relative-travel.css">
</head>

<body>

    <div class="allrelative">

        <div class="tripplace">
            <div class="box">

                <div class="trippic">
                    <img src="image/bf0c4b12ad0940c813ee24fad8d5d52d.jpg" alt="trippicture" width="100%">
                </div>

                <div class="tittle">
                    <h1>Let's go Trip</h1>

                    <p>14-29 June| by Robbin James</p>
                </div>

                <div class="icon">
                    <img src="image/maps-and-flags.png" width="20">

                    <img src="image/share.png" width="20">

                    <img src="image/comment.png" width="20">
                </div>

                <div class="peoplegoing">

                    <div class="show">
                        <img src="image/airplane.png" width="20" height="20">

                        <p>24 people going</p>
                    </div>

                    <div class="likeicon">
                        <img src="image/heart.png" width="20" height="20">
                    </div>

                </div>

            </div>

            <div class="commentbox">

                <div class="profile">
                    <img src="image/user.png" width="20" height="20">
                </div>

                <div class="comment">
                    <h6>Shaq</h6>

                    <p>Good place to enjoy in holiday.</p>

                </div>

                <div class="likecomment">
                    <img src="image/heart.png" width="12" height="12">
                </div>

            </div>
        </div>

        <div class="tripplace">
            <div class="box">

                <div class="trippic">

                </div>

                <div class="peoplegoing">

                    <div class="show">
                        <img src="image/airplane.png" width="20" height="20">

                        <p>24 people going</p>
                    </div>

                    <div class="likeicon">
                        <img src="image/heart.png" width="20" height="20">
                    </div>

                </div>

            </div>

            <div class="commentbox">

                <div class="profile">
                    <img src="image/man.png" width="20" height="20">

                    <h6>Shaq</h6>

                </div>

        </div>

</body>

</html>
